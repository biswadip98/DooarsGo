<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/dooarsgo-logo-mark.png" />
    <link rel="apple-touch-icon" href="/dooarsgo-logo-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Title & description -->
    <title>DooarsGo — Your Local Ride, Anytime</title>
    <meta
      name="description"
      content="Book a Toto, Bike or Car in seconds across Chepani, Kamakhyaguri, Barobisha and nearby Dooars areas. Fair fares, no commission — pay the driver directly by cash or UPI."
    />

    <!-- Mobile browser chrome + web-app feel -->
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DooarsGo" />

    <!-- Share preview (WhatsApp / Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DooarsGo" />
    <meta property="og:title" content="DooarsGo — Your Local Ride, Anytime" />
    <meta
      property="og:description"
      content="Go digital in the Dooars. Book a Toto, Bike or Car in seconds — fair fares, pay per ride, no commission."
    />
    <meta property="og:url" content="https://www.dooarsgo.online/" />
    <meta property="og:image" content="https://www.dooarsgo.online/dooarsgo-logo-full.png" />
    <meta property="og:image:alt" content="DooarsGo — Your Local Ride, Anytime" />

    <!-- Share preview (X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DooarsGo — Your Local Ride, Anytime" />
    <meta
      name="twitter:description"
      content="Book a Toto, Bike or Car in seconds across the Dooars. Fair fares, pay per ride, no commission."
    />
    <meta name="twitter:image" content="https://www.dooarsgo.online/dooarsgo-logo-full.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
